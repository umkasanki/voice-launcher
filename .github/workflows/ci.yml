name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Build and test (macOS)
    # macOS, not Linux: the app target needs AppKit and Speech, and the matcher
    # relies on Foundation's ICU transliteration.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Swift version
        run: swift --version
      - name: Build
        run: swift build
      - name: Run tests
        run: swift test
