name: Release

# Push a tag like v0.2.0 to cut a release:
#   git tag v0.2.0 && git push origin v0.2.0
# The job builds a .dmg, publishes a GitHub Release, and updates the Homebrew
# cask in umkasanki/homebrew-tap.
#
# Repo secrets:
#   SIGNING_P12_BASE64, SIGNING_P12_PASSWORD — the stable self-signed identity
#     "Voice Launcher Local", so the microphone grant survives updates. Without
#     them build-app.sh signs ad-hoc and macOS asks for the microphone again.
#   TAP_TOKEN — a token with Contents: write on umkasanki/homebrew-tap (the
#     default GITHUB_TOKEN cannot push to another repo). Without it the cask
#     step is skipped and the cask is bumped by hand.

on:
  push:
    tags: ['v*']

permissions:
  contents: write   # GITHUB_TOKEN may create the release on this repo

jobs:
  release:
    runs-on: macos-latest
    env:
      SIGNING_P12_BASE64: ${{ secrets.SIGNING_P12_BASE64 }}
      SIGNING_P12_PASSWORD: ${{ secrets.SIGNING_P12_PASSWORD }}
      TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - name: Derive version from tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Stamp bundle version from the tag
        run: /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${{ steps.ver.outputs.version }}" App/Info.plist

      - name: Test
        run: swift test

      - name: Import stable signing identity
        if: env.SIGNING_P12_BASE64 != ''
        run: |
          # Same keychain path and password as App/setup-signing.sh, which
          # build-app.sh looks for.
          KC="$HOME/Library/Keychains/voicelauncher.keychain-db"
          security create-keychain -p voicelauncher "$KC"
          security set-keychain-settings "$KC"
          security unlock-keychain -p voicelauncher "$KC"
          echo "$SIGNING_P12_BASE64" | base64 --decode > /tmp/signing.p12
          security import /tmp/signing.p12 -k "$KC" -P "$SIGNING_P12_PASSWORD" -A -T /usr/bin/codesign
          rm -f /tmp/signing.p12
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | sed 's/"//g')
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k voicelauncher "$KC" >/dev/null
          security find-identity "$KC" | tail -3

      - name: Build DMG
        run: ./App/make-dmg.sh

      - name: Compute SHA-256
        id: sha
        run: echo "sha=$(shasum -a 256 build/VoiceLauncher-${{ steps.ver.outputs.version }}.dmg | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Voice Launcher ${{ steps.ver.outputs.version }}" \
            --notes "Install via Homebrew:
          \`\`\`
          brew tap umkasanki/tap
          brew trust umkasanki/tap
          brew install --cask voice-launcher
          \`\`\`
          Or download the .dmg below. On first launch, allow the microphone and speech recognition.
          Self-signed, not notarized — see the [installation guide](https://github.com/umkasanki/voice-launcher/blob/main/docs/INSTALL.md)." \
            "build/VoiceLauncher-${{ steps.ver.outputs.version }}.dmg"

      - name: Update Homebrew cask
        if: env.TAP_TOKEN != ''
        run: |
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/umkasanki/homebrew-tap.git" tap
          cd tap
          sed -i '' -E "s/version \".*\"/version \"${{ steps.ver.outputs.version }}\"/" Casks/voice-launcher.rb
          sed -i '' -E "s/sha256 \".*\"/sha256 \"${{ steps.sha.outputs.sha }}\"/" Casks/voice-launcher.rb
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "voice-launcher ${{ steps.ver.outputs.version }}"
          git push
