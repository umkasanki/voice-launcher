<!-- Voice Launcher app icon, source of truth. tools/make-icon.swift draws the
     same picture with CoreGraphics (no SVG rasteriser is needed to build). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-23.08 -23.08 246.15 246.15" width="1024" height="1024">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FDBA74"/>
      <stop offset="1" stop-color="#EA580C"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glyph" x1="0" y1="34" x2="0" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FFEDD5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="3.5" flood-color="#7C2D12" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="200" height="200" rx="46" fill="url(#tile)"/>
  <rect width="200" height="200" rx="46" fill="url(#sheen)"/>
  <g transform="translate(100 98) scale(1.18) translate(-100 -95)" filter="url(#shadow)">
    <rect x="76" y="34" width="48" height="80" rx="24" fill="url(#glyph)"/>
    <path d="M62 92 A38 38 0 0 0 138 92 M100 130 V152 M80 155 H120"
          fill="none" stroke="url(#glyph)" stroke-width="12" stroke-linecap="round"/>
    <g fill="url(#tile)">
      <rect x="89" y="54.5" width="22" height="7" rx="3.5"/>
      <rect x="89" y="68.5" width="22" height="7" rx="3.5"/>
      <rect x="89" y="82.5" width="22" height="7" rx="3.5"/>
    </g>
  </g>
</svg>
